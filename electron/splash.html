<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LaserLockAI Loading</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 560px; height: 320px;
    background: linear-gradient(135deg, #050510 0%, #0a0a2e 40%, #0d1540 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    color: #ddeeff;
    border-radius: 14px;
    border: 1px solid rgba(80, 160, 255, 0.3);
    overflow: hidden;
    position: relative;
    user-select: none;
    -webkit-app-region: drag;
  }

  /* Animated laser beam ring */
  .ring {
    width: 90px; height: 90px;
    border-radius: 50%;
    border: 2px solid transparent;
    border-top-color: #00d4ff;
    border-right-color: #7b2fff;
    box-shadow: 0 0 15px rgba(0, 212, 255, 0.3), inset 0 0 15px rgba(123, 47, 255, 0.3);
    animation: spin 1.4s linear infinite;
    margin-bottom: 20px;
    position: relative;
    display: flex; align-items: center; justify-content: center;
  }
  .ring::after {
    content: '🔴';
    font-size: 28px;
    position: absolute;
    filter: drop-shadow(0 0 8px #ff2244);
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  h1 {
    font-size: 26px; font-weight: 800;
    letter-spacing: 4px; text-transform: uppercase;
    background: linear-gradient(90deg, #00d4ff, #7b2fff, #00d4ff);
    background-size: 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shimmer 2.5s linear infinite;
  }
  @keyframes shimmer { to { background-position: 200% center; } }

  p { font-size: 12px; color: #6888aa; margin-top: 6px; letter-spacing: 1px; }

  .bar {
    width: 320px; height: 4px;
    background: rgba(80, 160, 255, 0.12);
    border-radius: 4px; margin-top: 28px; overflow: hidden;
  }
  .fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #7b2fff, #00d4ff);
    box-shadow: 0 0 8px rgba(0, 212, 255, 0.6);
    border-radius: 4px;
    animation: load 3.5s cubic-bezier(.4,0,.2,1) forwards;
  }
  @keyframes load {
    0%   { width:  0%; }
    50%  { width: 65%; }
    85%  { width: 90%; }
    100% { width: 100%; }
  }

  .status {
    font-size: 11px; color: #5a8ab8;
    margin-top: 14px; letter-spacing: 0.5px;
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink { 50% { opacity: 0.35; } }

  /* Corner glow accents */
  .glow-tl {
    position: absolute; top: -40px; left: -40px; width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(123,47,255,.3), transparent 70%);
  }
  .glow-br {
    position: absolute; bottom: -40px; right: -40px; width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(0,212,255,.25), transparent 70%);
  }
</style>
</head>
<body>
  <div class="glow-tl"></div>
  <div class="glow-br"></div>
  <div class="ring"></div>
  <h1>LaserLockAI</h1>
  <p>FSOC Coarse Alignment Tracking System</p>
  <div class="bar"><div class="fill"></div></div>
  <div class="status">Initialising AI tracking engine…</div>
</body>
</html>
